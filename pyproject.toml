[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-thesis"
version = "0.1.0"
description = "Entropy-based warehouse picking worker allocation simulation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "networkx>=3.4,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "PyYAML>=6.0,<7",
    "scipy>=1.15,<2",
    "simpy>=4.1,<5",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
]
notebook = [
    "jupyterlab>=4.3,<5",
]
ai = [
    "scikit-learn>=1.7,<2",
    "xgboost>=3.0,<4",
]

[project.scripts]
entropy-thesis = "entropy_thesis.experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests"]