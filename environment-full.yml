# Portable direct-dependency snapshot. Exact versions are retained without
# platform-specific build identifiers or local absolute paths.
name: entropy-thesis
channels:
  - conda-forge
dependencies:
  - python=3.13.14
  - jupyterlab=4.5.9
  - matplotlib=3.11.0
  - numpy=2.5.1
  - pandas=3.0.3
  - pip
  - pyyaml=6.0.3
  - scipy=1.18.0
  - pip:
      - -e .
      - jsonschema==4.25.1
      - pytest==9.1.1
      - simpy==4.1.2
